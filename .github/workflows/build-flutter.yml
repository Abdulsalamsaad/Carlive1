name: Flutter — Build APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.2', channel: stable, cache: true }
      - run: flutter pub add intl:0.19.0
      - run: flutter pub get
      - run: flutter build apk --debug --no-shrink
      - uses: actions/upload-artifact@v4
        with: { name: dubai-carlift-debug.apk, path: build/app/outputs/flutter-apk/app-debug.apk, retention-days: 30 }
      - run: flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with: { name: dubai-carlift-release.apk, path: build/app/outputs/flutter-apk/app-release.apk, retention-days: 30 }
      - run: flutter build appbundle --release --no-shrink
      - uses: actions/upload-artifact@v4
        with: { name: dubai-carlift-release.aab, path: build/app/outputs/bundle/release/app-release.aab, retention-days: 30 }
